version: 2

models:
  - name: stg_trades
    columns:
      - name: trade_id
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: trade_side
        data_tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: settlement_currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'EUR', 'GBP']
      - name: venue_mic_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['XNAS', 'XNYS', 'XLON', 'XAMS']
      - name: execution_timestamp
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: execution_price
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: counterparty_id
        data_tests:
          - not_null:
              config:
                severity: warn
